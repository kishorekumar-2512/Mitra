services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/insightforge.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - insightforge-data:/app/data
    ports: ["8000:8000"]
    depends_on: [redis]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  insightforge-data:
